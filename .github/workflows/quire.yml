name: Quire · Desktop app

# Quire uses the built Electron app the way a person would and records checks with evidence.
# The app runs in this job on a virtual display; Quire attaches to its window over the DevTools
# port (QUIRE_BROWSER_CDP), so it never opens the app by URL or restarts it. See
# .quire/runbook.md for what Runs may and may not do.
#
# Needs: the QUIRE_API_TOKEN secret, and a @quireco/cli release with QUIRE_BROWSER_CDP support.

on:
  push:
    branches: [main]
    # Most commits to main are site and blog posts; only app changes need a Run.
    paths:
      - "src/**"
      - "resources/**"
      - "package.json"
      - "package-lock.json"
      - "electron.vite.config.ts"
      - "tsconfig*.json"
      - ".quire/**"
      - ".github/workflows/quire.yml"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quire-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QUIRE_BROWSER_CDP: "9222"
      MD_USER_DATA: /tmp/md-userdata
      APP_URL: file://${{ github.workspace }}/out/renderer/index.html
    steps:
      - uses: actions/checkout@v6
        with:
          # Quire reads the commits since the Trail's previous Run.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install display and Electron libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64

      - name: Build the app
        run: |
          npm ci
          npm run build

      # Onboarding checks that Claude Code shows as installed; no sign-in is needed for it.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      # The skills Trail (issue #793) needs one catalog skill already installed outside the app.
      - name: Pre-install the docx skill
        run: |
          mkdir -p ~/.claude/skills/docx /tmp/md-harness
          cat > ~/.claude/skills/docx/SKILL.md <<'EOF'
          ---
          name: docx
          description: Pre-installed copy of the docx skill, placed by hand to reproduce issue #793.
          ---

          # docx

          Placeholder installed outside the app so the Skills catalog's docx row is already installed.
          EOF

      - name: Start the app with a fresh profile
        run: |
          rm -rf "$MD_USER_DATA"
          nohup xvfb-run -a -s "-screen 0 1440x900x24" \
            ./node_modules/.bin/electron . --no-sandbox --remote-debugging-port=9222 \
            > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9222/json/list | grep -q '"type": "page"'; then exit 0; fi
            sleep 1
          done
          echo "::error title=App::The app did not open a window on port 9222 within 60 s."
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: "Quire: onboarding"
        uses: quireco/quire-action@v1
        with:
          api-token: ${{ secrets.QUIRE_API_TOKEN }}
          trail: onboarding
          url: ${{ env.APP_URL }}
          request: >-
            Munder Difflin is on a fresh profile showing the onboarding wizard. Complete
            onboarding as a technical user: harness home /tmp/md-harness, keep Claude Code as
            Michael's engine, skip adding a repo, turn off anonymous usage stats, and finish.
            Verify that each of the 4 steps shows its step label, that the engine step lists
            Claude Code as installed, and that after finishing the office floor shows Michael
            (Claude Code) with a message box to talk to him, with the command center and
            terminal fully visible at the window's right edge.

      # Issue #793 is open, so this Trail's last two checks fail today. It reports without
      # failing the job; remove `fail-on` once the fix lands so a regression fails CI.
      - name: "Quire: skills installed state (#793)"
        if: ${{ !cancelled() }}
        uses: quireco/quire-action@v1
        with:
          api-token: ${{ secrets.QUIRE_API_TOKEN }}
          trail: skills-installed-state
          url: ${{ env.APP_URL }}
          fail-on: ""
          request: >-
            Reproduce issue #793: the Skills catalog shows Install for skills that are already
            installed. The docx skill was pre-installed by hand at ~/.claude/skills/docx. In the
            right-hand Command Center open the skills tab and check: (1) docx is listed under
            Installed (Claude Code, user scope, path ~/.claude/skills/docx); (2) in browse, the
            docx catalog row (Document Skills, anthropics) shows an installed state (such as a
            disabled 'installed' button) rather than an Install button; (3) clicking that row's
            button does not fail with an error like 'Already installed at
            ~/.claude/skills/docx'. Capture a screenshot of each. Click Install only on the docx
            row and nothing else that installs.

      - name: App log
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/app.log" || true
